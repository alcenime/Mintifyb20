<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MINTIFY — Under Build</title>
<meta name="description" content="MINTIFY. we mint things. A new experiment is being built on Base.">
<style>
  :root{
    --bg: #FAF8F3;
    --bg-warm: #F5F1E8;
    --ink: #0A0A0A;
    --ink-soft: rgba(10,10,10,0.55);
    --ink-faint: rgba(10,10,10,0.32);
    --blue: #0052FF;
    --blue-glow: rgba(0,82,255,0.16);
    --line: rgba(10,10,10,0.08);
    --silver-1: #F4F6F9;
    --silver-2: #C9D1DC;
    --silver-3: #8A94A3;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow-x:hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body{
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- background: grid + glow + dots ---------- */
  .bg-layer{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  .bg-grid{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 80% 65% at 50% 42%, #000 0%, transparent 78%);
            mask-image: radial-gradient(ellipse 80% 65% at 50% 42%, #000 0%, transparent 78%);
    opacity: 0.9;
  }

  .bg-glow{
    position:absolute;
    top:50%;
    left:50%;
    width: min(900px, 130vw);
    height: min(900px, 130vw);
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--blue-glow) 0%, rgba(0,82,255,0.05) 40%, transparent 70%);
    filter: blur(10px);
  }

  .bg-dot{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background: var(--blue);
    opacity:0.35;
  }
  .bg-line{
    position:absolute;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    height:1px;
    opacity:0.25;
  }
  .bg-line.vert{
    background: linear-gradient(180deg, transparent, var(--blue), transparent);
    width:1px;
    height:auto;
  }

  /* ---------- header ---------- */
  header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 28px 32px;
    width:100%;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    font-weight:700;
    letter-spacing: 0.04em;
    color: var(--ink);
  }

  .brand-mark{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .header-tag{
    font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    font-size:11px;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    font-weight:600;
    white-space:nowrap;
  }

  /* ---------- main ---------- */
  main{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px 24px 8px;
    gap: 0;
  }

  .m-mark{
    width:104px;
    height:104px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 22px var(--blue-glow));
  }

  .brand-title{
    font-size: clamp(48px, 11vw, 92px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 0.95;
    margin: 4px 0 6px;
  }

  .tagline{
    font-size: clamp(15px, 3vw, 18px);
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    margin: 0 0 30px;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight:700;
    letter-spacing: 0.16em;
    color: var(--blue);
    background: rgba(0,82,255,0.04);
    margin-bottom: 22px;
  }

  .status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background: var(--blue);
    box-shadow: 0 0 0 0 rgba(0,82,255,0.5);
    animation: pulse 2.2s ease-out infinite;
  }

  @keyframes pulse{
    0%   { box-shadow: 0 0 0 0 rgba(0,82,255,0.45); }
    70%  { box-shadow: 0 0 0 8px rgba(0,82,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,82,255,0); }
  }

  .desc{
    max-width: 460px;
    font-size: clamp(14px, 2.6vw, 16px);
    line-height:1.6;
    color: var(--ink-soft);
    margin: 0 0 34px;
    font-weight: 450;
  }

  .desc strong{ color: var(--ink); font-weight:650; }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding: 17px 30px;
    background: var(--ink);
    color: #fff;
    text-decoration:none;
    font-size: 14px;
    font-weight:700;
    letter-spacing: 0.03em;
    border-radius: 10px;
    border: 1px solid var(--ink);
    transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    -webkit-tap-highlight-color: transparent;
  }

  .cta:hover{
    background: var(--blue);
    border-color: var(--blue);
    box-shadow: 0 8px 24px rgba(0,82,255,0.28);
    transform: translateY(-1px);
  }
  .cta:active{ transform: translateY(0); }

  .cta svg{ width:14px; height:14px; }

  .sub-meta{
    margin-top: 26px;
    font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
    font-weight:600;
  }

  .sub-meta span{ color: var(--blue); }

  /* ---------- footer ---------- */
  footer{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 20px 32px 26px;
    width:100%;
    border-top: 1px solid var(--line);
  }

  .footer-left{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .footer-brand{
    font-size:13px;
    font-weight:800;
    letter-spacing:0.02em;
  }

  .footer-sub{
    font-size:11px;
    color: var(--ink-faint);
  }

  .footer-right{
    display:flex;
    align-items:center;
    gap:18px;
    font-size:12px;
    color: var(--ink-soft);
  }

  .footer-right a{
    color: var(--ink);
    text-decoration:none;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .footer-right a:hover{ color: var(--blue); }
  .footer-right svg{ width:13px; height:13px; }

  .copyright{
    color: var(--ink-faint);
  }

  /* ---------- mobile ---------- */
  @media (max-width: 640px){
    header{ padding: 20px 20px; }
    .header-tag{ font-size:10px; }

    main{ padding: 8px 20px 6px; }
    .m-mark{ width:76px; height:76px; margin-bottom:2px; }
    .brand-title{ margin: 2px 0 4px; }
    .tagline{ margin-bottom: 20px; }
    .status-pill{ margin-bottom: 16px; }
    .desc{ margin-bottom: 26px; }
    .cta{ padding: 16px 26px; width:100%; max-width: 320px; justify-content:center; }
    .sub-meta{ margin-top:20px; }

    footer{
      flex-direction:column;
      align-items:flex-start;
      gap:14px;
      padding: 18px 20px 22px;
    }
    .footer-right{ width:100%; justify-content:space-between; }
  }

  @media (max-height: 700px) and (max-width: 640px){
    .m-mark{ width:58px; height:58px; }
    .brand-title{ font-size: clamp(38px, 12vw, 60px); }
    .tagline{ margin-bottom:14px; }
    .status-pill{ margin-bottom:12px; }
    .desc{ margin-bottom:18px; }
  }

  @media (prefers-reduced-motion: reduce){
    .status-dot{ animation:none; }
    .cta{ transition:none; }
  }
</style>
</head>
<body>

  <div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-line" style="top:22%; left:0; width:38%;"></div>
    <div class="bg-line" style="top:72%; right:0; width:30%; left:auto;"></div>
    <div class="bg-line vert" style="left:14%; top:10%; height:22%;"></div>
    <div class="bg-line vert" style="right:16%; left:auto; top:60%; height:26%;"></div>
    <div class="bg-dot" style="top:20%; left:12%;"></div>
    <div class="bg-dot" style="top:78%; left:18%;"></div>
    <div class="bg-dot" style="top:30%; right:10%;"></div>
    <div class="bg-dot" style="top:68%; right:22%;"></div>
  </div>

  <header>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 32V8L14 20L20 8L26 20L36 8V32" stroke="#0052FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      MINTIFY
    </div>
    <div class="header-tag">B20 · BASE</div>
  </header>

  <main>
    <svg class="m-mark" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#F4F6F9"/>
          <stop offset="50%" stop-color="#C9D1DC"/>
          <stop offset="100%" stop-color="#8A94A3"/>
        </linearGradient>
        <filter id="mGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path d="M14 96V24L38 62L60 24L82 62L106 24V96"
            fill="none"
            stroke="url(#silverGrad)"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <path d="M14 96V24L38 62L60 24L82 62L106 24V96"
            fill="none"
            stroke="#0052FF"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#mGlow)"
            opacity="0.85"/>
    </svg>

    <h1 class="brand-title">MINTIFY</h1>
    <p class="tagline">we mint things.</p>

    <div class="status-pill">
      <span class="status-dot"></span>
      UNDER BUILD
    </div>

    <p class="desc">A new experiment is being built on <strong>Base</strong>.<br>Something is coming.</p>

    <a class="cta" href="https://x.com/MintifyB20" target="_blank" rel="noopener noreferrer">
      FOLLOW @MINTIFYB20
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 17L17 7M17 7H8M17 7V16" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="sub-meta">B20 · BASE &nbsp;·&nbsp; <span>ONCHAIN EXPERIMENT</span></div>
  </main>

  <footer>
    <div class="footer-left">
      <div class="footer-brand">MINTIFY</div>
      <div class="footer-sub">we mint things.</div>
    </div>
    <div class="footer-right">
      <span class="copyright">© 2026 MINTIFY</span>
      <a href="https://x.com/MintifyB20" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        @MintifyB20
      </a>
    </div>
  </footer>

</body>
</html>
